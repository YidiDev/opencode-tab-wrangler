name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "27 5 * * 1"
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - run: python3 -m pip install -r requirements-dev.txt
      - run: bun run check
      - run: bun run lint:python
      - run: bun run lint:workflows
      - run: bun run test:coverage
      - run: bun run test:security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7
  installed-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - name: Install integrity-pinned OpenCode 2.1.4
        run: python3 tools/install-host.py >> "$GITHUB_PATH"
      - run: bun run test:live
      - run: bun run test:compat
      - run: bun run test:package
      # Raw terminal/server logs stay local: do not upload credentials or arbitrary transcript data.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: preview-package
          path: |
            opencode-tab-wrangler-*.tgz
            .artifacts/release/runtime-dependencies.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
